  ${parent?`<div class="callout info">Esta subtarea quedará ligada a «${esc(parent.titulo)}». Su fecha no puede pasar del ${fmtDate(parent.fechaLimite)}.</div>`:""}
  <form class="f" id="taskForm">
    <div class="field"><label for="tTitulo">Tarea</label><input type="text" id="tTitulo" required maxlength="90" value="${esc(v.titulo)}" placeholder="Ej: Reservar sala para ensayo general"></div>
    <div class="field"><label for="tDesc">Detalle</label><textarea id="tDesc" maxlength="1000" placeholder="Qué hay que hacer, contactos, materiales…">${esc(v.descripcion)}</textarea></div>
    <div class="two"><div class="field"><label for="tCat">Categoría</label><select class="input" id="tCat">${CATS.map(c=>`<option ${v.categoria===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
      <div class="field"><label for="tPrio">Prioridad</label><select class="input" id="tPrio">${Object.entries(PRIOS).map(([k,l])=>`<option value="${k}" ${v.prioridad===k?"selected":""}>${l}</option>`).join("")}</select></div></div>
    <div class="field"><label for="tFecha">Fecha límite</label><input type="date" id="tFecha" required value="${esc(v.fechaLimite)}" ${parent?`max="${esc(parent.fechaLimite)}"`:""}>
      ${t&&t.fechaLimiteOriginal&&t.fechaLimiteOriginal!==t.fechaLimite?`<span class="hint">Plazo original: ${fmtDate(t.fechaLimiteOriginal)}</span>`:""}</div>
    <div class="field"><label>Asignar a</label>
      ${me().grado==="pardillo"?`<span class="hint">Como pardillo puedes asignar a pardillos y aspirantes.</span>`:""}
      <div class="checks">${ids.length?ids.map(id=>`<label><input type="checkbox" name="asg" value="${esc(id)}" ${(v.asignados||[]).includes(id)?"checked":""} ${canAssignTo(id)?"":"disabled"}> ${esc(nameOf(id))}${id===S.myId?" (tú)":""} <span class="grado g-${grado(id)}" style="margin-left:auto">${GRADOS[grado(id)]}</span></label>`).join(""):`<span style="padding:8px;color:var(--muted)">No hay integrantes a quienes puedas asignar.</span>`}</div></div>
    <button class="btn primary" type="submit">${t?"Guardar cambios":"Crear tarea"}</button>
  </form>`}
function plazoForm(t){
  const orig=t.fechaLimiteOriginal||t.fechaLimite;const min=t.fechaLimite>todayStr()?t.fechaLimite:todayStr();
  return `<h2>Solicitar nueva fecha</h2>
  <div class="callout info">Fecha actual: <b>${fmtDate(t.fechaLimite)}</b>. Puedes pedirlo hasta el ${fmtDate(orig)}, el plazo fijado originalmente. Un tuno debe aprobarlo.</div>
  <form class="f" id="plazoForm"><div class="field"><label for="pFecha">Nueva fecha que propones</label><input type="date" id="pFecha" required min="${esc(min)}"></div>
  <div class="field"><label for="pMotivo">Motivo</label><textarea id="pMotivo" required maxlength="300">${esc(plazoCheck(t).nota?.texto||"")}</textarea></div>
  <button class="btn gold" type="submit">Enviar solicitud</button></form>`}
function confirmBox(o){return `<h2>${esc(o.title)}</h2><div class="confirm-box"><p style="margin:0">${esc(o.text)}</p><div class="btn-row"><button class="btn danger" data-confirm-yes>${esc(o.yes)}</button><button class="btn" data-close>Cancelar</button></div></div>`}

// ---------- escrituras ----------
async function safe(fn,ok){try{await fn();if(ok)toast(ok)}catch(e){toast(e&&e.code==="permission-denied"?"Tu grado no tiene permiso para hacer esto.":"No se pudo guardar. Revisa tu conexión e intenta de nuevo.")}}
const tref=id=>S.db.doc("tareas/"+id);
function note(autor,texto,tipo){return {id:uid(),autor,texto,tipo:tipo||"nota",fecha:new Date().toISOString()}}

document.addEventListener("submit",async e=>{
  const f=e.target;e.preventDefault();
  if(f.id==="ownerForm"){const ap=$("#ownApodo").value.trim();if(!ap)return;
    await safe(()=>S.db.doc("miembros/"+S.myId).set({apodo:ap,grado:"tuno",agrupacion:AGRUPACION,desde:new Date().toISOString(),admin:true}),"Listo, ya eres parte del planificador")}
  if(f.id==="joinForm"){const ap=$("#joinApodo").value.trim();if(!ap)return;
    await safe(()=>S.db.doc("solicitudes/"+S.myId).set({apodo:ap,mensaje:$("#joinMsg").value.trim(),ingreso:$("#joinIngreso").value||"",nombre:S.authUser.displayName||"",correo:S.authUser.email||"",agrupacion:AGRUPACION,fecha:new Date().toISOString()}),"Solicitud enviada")}
  if(f.id==="taskForm"){
    const o=S.sheet;const asg=[...f.querySelectorAll('input[name=asg]:checked')].map(i=>i.value);
    const fecha=$("#tFecha").value;const parent=o.padre&&S.tasks.find(x=>x.id===o.padre);
    if(parent&&fecha>parent.fechaLimite){toast("La subtarea no puede vencer después que la tarea principal.");return}
    const data={titulo:$("#tTitulo").value.trim(),descripcion:$("#tDesc").value.trim(),categoria:$("#tCat").value,prioridad:$("#tPrio").value,fechaLimite:fecha,asignados:asg};
    if(o.id){const t=S.tasks.find(x=>x.id===o.id);if(t&&fecha!==t.fechaLimite&&!isTuno()&&t.creadoPor===S.myId){/* el creador puede ajustar */}
      await safe(()=>tref(o.id).update({...data,actualizado:new Date().toISOString()}),"Cambios guardados");openSheet({type:"task",id:o.id})}
    else{const id=uid();await safe(()=>tref(id).set({...data,estado:"pendiente",fechaLimiteOriginal:fecha,creadoPor:S.myId,agrupacion:AGRUPACION,padre:o.padre||null,notas:[],solicitudPlazo:null,creado:new Date().toISOString()}),"Tarea creada");
      if(o.padre)openSheet({type:"task",id:o.padre});else closeSheet()}}
  if(f.id==="llamadoForm"){const o=S.sheet,vin=$("#lVinc").value,now=new Date().toISOString();
    const data={tipo:$("#lTipo").value,titulo:$("#lTitulo").value.trim(),fecha:$("#lFecha").value,hora:$("#lHora").value,lugar:$("#lLugar").value.trim(),mensaje:$("#lMsg").value.trim(),
      vinculo:vin?{col:vin.split(":")[0],id:vin.split(":")[1]}:null};
    const sel=[...f.querySelectorAll("input[name=asis]:checked")].map(i=>i.value),id=o.id||uid();
    await safe(async()=>{
      if(o.id)await S.db.doc("llamados/"+id).update({...data,actualizado:now});else await S.db.doc("llamados/"+id).set({...data,creadoPor:S.myId,agrupacion:AGRUPACION,creado:now});
      const prev=respDe(id).filter(r=>r.r==="voy").map(r=>r.uid);
      for(const u of sel)if(!prev.includes(u))await S.db.doc("respuestas/"+id+"__"+u).set({llamado:id,uid:u,r:"voy",fecha:now,fechaLlamado:data.fecha,agrupacion:AGRUPACION,sumadoPor:S.myId});
      for(const u of prev)if(!sel.includes(u))await S.db.doc("respuestas/"+id+"__"+u).delete();
      if(data.vinculo){const ev=(data.vinculo.col==="parches"?S.parches:S.contratos).find(x=>x.id===data.vinculo.id);
        if(ev){const a=new Set([...(ev.asistentes||[]).filter(x=>!(prev.includes(x)&&!sel.includes(x))),...sel]);await S.db.doc(data.vinculo.col+"/"+ev.id).update({asistentes:[...a]})}}
    },o.id?"Llamado guardado":"Llamado publicado");
    closeSheet()}
  if(f.id==="parcheForm"){const o=S.sheet;const conteo={};
    f.querySelectorAll("[data-den]").forEach(i=>{const n=Math.max(0,Math.floor(+i.value||0));if(n)conteo["d"+i.dataset.den]=n});
    const data={lugar:$("#pLugar").value.trim(),fecha:$("#pFechaP").value,hora:$("#pHora").value,conteo,otro:Math.round(+$("#pOtro").value||0),
      gastos:Math.max(0,Math.round(+$("#pGastos").value||0)),gastosDetalle:$("#pGastosDet").value.trim(),
      asistentes:[...f.querySelectorAll('input[name=asis]:checked')].map(i=>i.value),notas:$("#pNotas").value.trim()};
    data.total=parcheTotal(data);data.neto=data.total-data.gastos;
    if(o.id){await safe(()=>S.db.doc("parches/"+o.id).update({...data,actualizado:new Date().toISOString()}),"Parche guardado");openSheet({type:"parche",id:o.id})}
    else{const id=uid();await safe(()=>S.db.doc("parches/"+id).set({...data,creadoPor:S.myId,agrupacion:AGRUPACION,creado:new Date().toISOString()}),"Parche registrado");closeSheet()}}
  if(f.id==="contratoForm"){const o=S.sheet;
    const costos=[...f.querySelectorAll(".costo-row")].map(r=>({concepto:r.querySelector("[data-costo-concepto]").value.trim(),monto:Math.max(0,Math.round(+r.querySelector("[data-costo-monto]").value||0))})).filter(x=>x.concepto||x.monto);
    const data={cliente:$("#cCliente").value.trim(),tipo:$("#cTipo").value,estado:$("#cEstado").value,fecha:$("#cFecha").value,hora:$("#cHora").value,
      lugar:$("#cLugar").value.trim(),contacto:$("#cContacto").value.trim(),monto:Math.max(0,Math.round(+$("#cMonto").value||0)),costos,
      asistentes:[...f.querySelectorAll('input[name=asis]:checked')].map(i=>i.value),notas:$("#cNotas").value.trim()};
    data.costoTotal=costosTotal(data);data.utilidad=data.monto-data.costoTotal;
    if(o.id){await safe(()=>S.db.doc("contratos/"+o.id).update({...data,actualizado:new Date().toISOString()}),"Contrato guardado");openSheet({type:"contrato",id:o.id})}
    else{const id=uid();await safe(()=>S.db.doc("contratos/"+id).set({...data,creadoPor:S.myId,agrupacion:AGRUPACION,creado:new Date().toISOString()}),"Contrato registrado");closeSheet()}}
  if(f.id==="noteForm"){const t=S.tasks.find(x=>x.id===S.sheet.id);const txt=$("#noteText").value.trim();if(!t||!txt)return;
    const need=$("#noteNeedsTime")?.checked;
    await safe(()=>tref(t.id).update({notas:[...(t.notas||[]),note(S.myId,txt,need?"requiere_plazo":"nota")]}),need?"Nota agregada. Ya puedes solicitar nueva fecha.":"Nota agregada");
    const ta=$("#noteText");if(ta)ta.value=""}
  if(f.id==="plazoForm"){const t=S.tasks.find(x=>x.id===S.sheet.id);const pc=plazoCheck(t);if(!pc.ok){toast(pc.why);return}
    const nf=$("#pFecha").value,mot=$("#pMotivo").value.trim();if(!nf||!mot)return;
    if(nf<=t.fechaLimite){toast("La nueva fecha debe ser posterior a la fecha límite actual.");return}
    const notas=(t.notas||[]).map(n=>n.id===pc.nota.id?{...n,usada:true}:n);
    notas.push(note(S.myId,"Solicitó cambiar la fecha límite al "+fmtDate(nf)+".","sistema"));
    await safe(()=>tref(t.id).update({solicitudPlazo:{por:S.myId,nuevaFecha:nf,motivo:mot,fecha:new Date().toISOString(),estado:"pendiente"},notas}),"Solicitud enviada a los tunos");
    openSheet({type:"task",id:t.id})}
});

async function resolvePlazo(id,ok){
  const t=S.tasks.find(x=>x.id===id);if(!t||!t.solicitudPlazo)return;const s=t.solicitudPlazo;
  const notas=[...(t.notas||[]),note(S.myId,ok?"Aprobó el nuevo plazo: "+fmtDate(s.nuevaFecha)+".":"Rechazó la solicitud de plazo. Se mantiene el "+fmtDate(t.fechaLimite)+".","sistema")];
  const upd={solicitudPlazo:null,notas,ultimoPlazo:{...s,estado:ok?"aprobada":"rechazada",resueltoPor:S.myId}};
  if(ok)upd.fechaLimite=s.nuevaFecha;
  await safe(()=>tref(id).update(upd),ok?"Plazo aprobado":"Solicitud rechazada")}

document.addEventListener("change",async e=>{
  const el=e.target;
  if(el.id==="fcat"){S.filterCat=el.value;render()}
  if(el.id==="fper"){S.filterPersona=el.value;render()}
  if(el.dataset.ingreso&&el.value){await safe(()=>S.db.doc("miembros/"+el.dataset.ingreso).update({ingreso:el.value,ingresoMs:msOf(el.value)}),"Fecha de ingreso guardada");return}
  if(el.dataset.grado){const id=el.dataset.grado;await safe(()=>S.db.doc("miembros/"+id).update({grado:el.value}),nameOf(id)+" ahora es "+GRADOS[el.value].toLowerCase())}
});

document.addEventListener("click",async e=>{
  const b=e.target.closest("button,a,[data-backdrop]");if(!b)return;const ds=b.dataset;
  if("backdrop" in ds&&e.target===b){closeSheet();return}
  if("close" in ds){closeSheet();return}
  if("login" in ds){const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
    try{await firebase.auth().signInWithPopup(p)}catch(e){
      if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(e.code))firebase.auth().signInWithRedirect(p);
      else if(e.code!=="auth/popup-closed-by-user"){S.loginError="No se pudo iniciar sesión ("+e.code+").";render()}}return}
  if("logout" in ds){firebase.auth().signOut();return}
  if(ds.nav){S.view=ds.nav;closeSheet();render();window.scrollTo(0,0);return}
  if(ds.tab){S.tareasTab=ds.tab;if(ds.tab==="mias")S.filterPersona="";render();return}
  if(ds.llamado){openSheet({type:"llamado",id:ds.llamado});return}
  if(ds.editLlamado){openSheet({type:"llamadoForm",id:ds.editLlamado});return}
  if(ds.delLlamado){const id=ds.delLlamado;openSheet({type:"confirm",title:"¿Eliminar el llamado?",text:"Se borrará el llamado y las respuestas de los integrantes.",yes:"Eliminar",
    run:async()=>{for(const r of respDe(id))await S.db.doc("respuestas/"+r.id).delete();await S.db.doc("llamados/"+id).delete()}});return}
  if(ds.resp){const l=S.llamados.find(x=>x.id===(S.sheet&&S.sheet.id));if(!l)return;const mr=miResp(l.id);if(mr===ds.resp)return;
    if(ds.resp==="voy"&&!puedeSumarse(l.tipo)){toast("Un tuno debe sumarte.");return}
    await setResp(l,S.myId,ds.resp,ds.resp==="voy"?"Confirmaste que vas":"Avisaste que no puedes");return}
  if(ds.parche){openSheet({type:"parche",id:ds.parche});return}
  if(ds.contrato){openSheet({type:"contrato",id:ds.contrato});return}
  if(ds.editParche){openSheet({type:"parcheForm",id:ds.editParche});return}
  if(ds.editContrato){openSheet({type:"contratoForm",id:ds.editContrato});return}
  if(ds.delParche){const id=ds.delParche;openSheet({type:"confirm",title:"¿Eliminar el parche?",text:"Se borrará el registro con su conteo de dinero y asistentes. Esto no se puede deshacer.",yes:"Eliminar",run:()=>S.db.doc("parches/"+id).delete()});return}
  if(ds.delContrato){const id=ds.delContrato;openSheet({type:"confirm",title:"¿Eliminar el contrato?",text:"Se borrará el contrato con su costeo y asistentes. Esto no se puede deshacer.",yes:"Eliminar",run:()=>S.db.doc("contratos/"+id).delete()});return}
  if(ds.anotar){const [k,id]=ds.anotar.split(":");const col=k==="parche"?"parches":"contratos";const ev=(k==="parche"?S.parches:S.contratos).find(x=>x.id===id);if(!ev)return;
    const a=ev.asistentes||[];const yo=a.includes(S.myId);if(!yo&&!antiguedadOk(S.myId)){toast("Un tuno debe sumarte.");return}
    await safe(()=>S.db.doc(col+"/"+id).update({asistentes:yo?a.filter(x=>x!==S.myId):[...a,S.myId]}),yo?"Te quitaste de la lista":"Quedaste anotado");return}
  if("costoAdd" in ds){$("#costos").insertAdjacentHTML("beforeend",costoRow({}));updateLive();return}
  if("costoDel" in ds){b.closest(".costo-row").remove();updateLive();return}
  if(ds.kper){S.kpiPeriodo=ds.kper;render();return}
  if(ds.export){exportCsv(ds.export);return}
  if(ds.fest){S.filterEstado=ds.fest;render();return}
  if(ds.open){e.preventDefault();openSheet({type:"task",id:ds.open});return}
  if(b.id==="fab"){openSheet({type:S.view==="parches"?"parcheForm":S.view==="contratos"?"contratoForm":S.view==="llamados"?"llamadoForm":"form"});return}
  if(ds.edit){openSheet({type:"form",id:ds.edit});return}
  if(ds.split){openSheet({type:"form",padre:ds.split});return}
  if(ds.plazoReq){openSheet({type:"plazo",id:ds.plazoReq});return}
  if(ds.plazoOk){await resolvePlazo(ds.plazoOk,true);return}
  if(ds.plazoNo){await resolvePlazo(ds.plazoNo,false);return}
  if(ds.estado){const t=S.tasks.find(x=>x.id===S.sheet.id);if(!t||t.estado===ds.estado)return;
    await safe(()=>tref(t.id).update({estado:ds.estado,completada:ds.estado==="realizada"?new Date().toISOString():null,aTiempo:ds.estado==="realizada"?(!t.fechaLimite||todayStr()<=t.fechaLimite):null,notas:[...(t.notas||[]),note(S.myId,"Cambió el estado a «"+ESTADOS[ds.estado]+"».","sistema")]}),"Estado: "+ESTADOS[ds.estado]);return}
  if(ds.del){const t=S.tasks.find(x=>x.id===ds.del);openSheet({type:"confirm",title:"¿Eliminar la tarea?",text:"Se borrará «"+(t?.titulo||"")+"» con sus notas. Esto no se puede deshacer.",yes:"Eliminar",run:()=>tref(ds.del).delete()});return}
  if(ds.remove){const id=ds.remove;openSheet({type:"confirm",title:"¿Quitar a "+nameOf(id)+"?",text:"Dejará de aparecer en el planificador. Sus tareas se mantienen.",yes:"Quitar",run:()=>S.db.doc("miembros/"+id).delete()});return}
  if("confirmYes" in ds){const run=S.sheet.run;closeSheet();await safe(run,"Hecho");return}
  if(ds.accept){const r=S.requests.find(x=>x.id===ds.accept);const g=$("#rq-"+CSS.escape(ds.accept))?.value||"aspirante";
    await safe(async()=>{await S.db.doc("miembros/"+r.id).set({apodo:r.apodo,grado:g,agrupacion:r.agrupacion||AGRUPACION,ingreso:r.ingreso||todayStr(),ingresoMs:msOf(r.ingreso||todayStr()),desde:new Date().toISOString()});await S.db.doc("solicitudes/"+r.id).delete()},r.apodo+" fue aceptado como "+GRADOS[g].toLowerCase());return}
  if(ds.reject){await safe(()=>S.db.doc("solicitudes/"+ds.reject).delete(),"Solicitud rechazada");return}
  if("cancelReq" in ds){await safe(()=>S.db.doc("solicitudes/"+S.myId).delete(),"Solicitud cancelada");return}
  if(ds.person){S.view="tareas";S.tareasTab="todas";S.filterPersona=ds.person;S.filterEstado="activas";render();window.scrollTo(0,0);return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.sheet)closeSheet()});

// tooltip de los gráficos (hover en computador, toque en celular)
const tipEl=document.createElement("div");tipEl.id="tip";tipEl.hidden=true;document.body.appendChild(tipEl);
function showTip(e){const t=e.target.closest&&e.target.closest("[data-tip]");if(!t){tipEl.hidden=true;return}
  tipEl.textContent=t.getAttribute("data-tip");tipEl.hidden=false;const r=tipEl.getBoundingClientRect();
  let x=e.clientX+12,y=e.clientY-r.height-12;if(x+r.width>innerWidth-8)x=e.clientX-r.width-12;if(x<8)x=8;if(y<8)y=e.clientY+18;
  tipEl.style.left=x+"px";tipEl.style.top=y+"px"}
document.addEventListener("pointermove",showTip);document.addEventListener("pointerdown",showTip);
window.addEventListener("scroll",()=>{tipEl.hidden=true},{passive:true});
document.addEventListener("input",updateLive);

// instalación y actualización automática
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  const hadCtl=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.register("sw.js").then(reg=>{setInterval(()=>reg.update().catch(()=>{}),30*60*1000)}).catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!hadCtl||reloaded)return;reloaded=true;
    if(S.sheet){toast("Hay una versión nueva. Se aplicará al volver a abrir la app.")}else location.reload()});
}
boot();
})();
</script>
