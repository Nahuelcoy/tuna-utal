<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tuna UTAL · Planificador</title>
<meta name="theme-color" content="#5e0d14">
<meta name="description" content="Planificador de tareas, llamados, parches y contratos de la Tuna de la Universidad de Talca.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tuna UTAL">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una columna para celular (máx 600px), cabecera vino con el escudo, navegación fija abajo, fichas de tarea con franja de prioridad. */
:root{
  --bg:#f5f1ef; --surface:#ffffff; --surface-2:#faf6f4; --ink:#2b1416; --muted:#78625f; --line:#e7dbd8;
  --wine:#6b1018; --wine-ink:#6b1018; --wine-soft:#f4e2e3; --gold:#c8941b; --gold-soft:#f9eed4; --gold-ink:#7a5608;
  --head:#5e0d14; --on-head:#fff5e1;
  --ok:#2f7a4a; --ok-soft:#e2f2e7; --warn:#a8650f; --warn-soft:#fbecd7; --bad:#b42318; --bad-soft:#fbe4e1; --info:#2f5f8a; --info-soft:#e3edf7;
  --shadow:0 1px 2px rgba(60,10,15,.08),0 4px 14px rgba(60,10,15,.06);
  --s-parche:#a8303a; --s-contrato:#b8860f;
  --f-display:"Alegreya Sans SC","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150b0c; --surface:#211415; --surface-2:#1b1011; --ink:#f4e8e7; --muted:#b39c9a; --line:#3a2729;
  --wine:#8e1d27; --wine-ink:#ee8f97; --wine-soft:#3a1519; --gold:#e0b04a; --gold-soft:#3a2c10; --gold-ink:#f0c86f;
  --head:#3d080e; --on-head:#fff1d6;
  --ok:#6cc58b; --ok-soft:#173222; --warn:#f0b35c; --warn-soft:#3a2a10; --bad:#f2877b; --bad-soft:#3d1713; --info:#8fbbe6; --info-soft:#152a3d;
  --s-parche:#c95560; --s-contrato:#b88a2a; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150b0c; --surface:#211415; --surface-2:#1b1011; --ink:#f4e8e7; --muted:#b39c9a; --line:#3a2729;
  --wine:#8e1d27; --wine-ink:#ee8f97; --wine-soft:#3a1519; --gold:#e0b04a; --gold-soft:#3a2c10; --gold-ink:#f0c86f;
  --head:#3d080e; --on-head:#fff1d6;
  --ok:#6cc58b; --ok-soft:#173222; --warn:#f0b35c; --warn-soft:#3a2a10; --bad:#f2877b; --bad-soft:#3d1713; --info:#8fbbe6; --info-soft:#152a3d;
  --s-parche:#c95560; --s-contrato:#b88a2a; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--on-head);border-bottom:3px solid var(--gold)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
header.top img{width:44px;height:45px;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.brand{min-width:0;flex:1}
.brand h1{margin:0;font-family:var(--f-display);font-size:21px;letter-spacing:.02em;line-height:1.1}
.brand small{display:block;font-size:12px;opacity:.85;letter-spacing:.04em}
.me-chip{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;gap:2px;text-align:right;min-width:0}
.me-chip b{font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{padding-block:16px 110px}
.grado{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.g-tuno{background:var(--gold);color:#2b1a00}
.g-pardillo{background:var(--wine-soft);color:var(--wine-ink)}
.g-aspirante{background:var(--info-soft);color:var(--info)}
header .g-pardillo{background:#fff5e1;color:#5e0d14}
header .g-aspirante{background:#e3edf7;color:#24496b}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 0 12px}
.section-head h2{margin:0;font-family:var(--f-display);font-size:24px;text-wrap:balance}
.section-head span{color:var(--muted);font-size:13px}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.summary div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.summary b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.summary span{font-size:12px;color:var(--muted)}
.summary .alert b{color:var(--bad)}

.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--wine);border-color:var(--wine);color:#fff}
select.chip{appearance:auto;padding-right:8px}

.list{display:flex;flex-direction:column;gap:10px}
.group-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}
.task{display:grid;grid-template-columns:4px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;width:100%;padding:0;box-shadow:var(--shadow)}
.task .stripe{background:var(--line)}
.task.p-alta .stripe{background:var(--bad)} .task.p-media .stripe{background:var(--gold)} .task.p-baja .stripe{background:var(--ok)}
.task .body{padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:6px}
.task .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.task h3{margin:0;font-size:16px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.task.done h3{text-decoration:line-through;color:var(--muted)}
.cat{font-size:11.5px;font-weight:600;color:var(--gold-ink);background:var(--gold-soft);padding:2px 8px;border-radius:6px}
.meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.due{font-variant-numeric:tabular-nums}
.due.late{color:var(--bad);font-weight:600} .due.soon{color:var(--warn);font-weight:600}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.st-pendiente{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.st-en_curso{background:var(--info-soft);color:var(--info)}
.st-realizada{background:var(--ok-soft);color:var(--ok)}
.pl-pend{background:var(--warn-soft);color:var(--warn)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:24px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--wine);border-color:var(--wine);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2b1a00}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:15;width:58px;height:58px;border-radius:50%;border:0;background:var(--gold);color:#2b1a00;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(60,10,15,.3);cursor:pointer}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .wrap{display:flex;justify-content:space-around}
nav.bottom button{flex:1;background:none;border:0;padding:8px 4px 10px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav.bottom button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.bottom button[aria-current="page"]{color:var(--wine-ink)}
nav.bottom button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;border-radius:999px;padding:1px 5px;font-variant-numeric:tabular-nums}

.overlay{position:fixed;inset:0;z-index:40;background:rgba(20,5,7,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-family:var(--f-display);font-size:22px;margin:0 0 12px;text-wrap:balance;overflow-wrap:anywhere}
.sheet .close{float:right;background:none;border:0;font-size:26px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.block h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-weight:600;font-size:13px;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{border-color:var(--wine);background:var(--wine);color:#fff}
.notes{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.note{border-left:3px solid var(--line);padding-left:10px}
.note.requiere_plazo{border-color:var(--warn)} .note.sistema{border-color:var(--gold)}
.note .who{font-size:12px;color:var(--muted)}
.note p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.callout{border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:10px}
.callout.warn{background:var(--warn-soft);color:var(--ink)} .callout.info{background:var(--info-soft);color:var(--ink)}

form.f{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=date],select.input,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:4px}
.checks label{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;font-size:14px}
.checks label:hover{background:var(--surface-2)}
.checks input{width:18px;height:18px;accent-color:var(--wine)}
.inline-check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.inline-check input{margin-top:3px;accent-color:var(--warn)}

.person{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--wine);font-size:14px}
.person .info{flex:1;min-width:0}
.person .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .info span{font-size:12.5px;color:var(--muted)}
.person select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px}

.welcome{text-align:center;padding-block:24px}
.welcome img{width:140px;height:auto}
.welcome h2{font-family:var(--f-display);font-size:26px;margin:12px 0 6px}
.welcome p{color:var(--muted);margin:0 auto 16px;max-width:42ch}
.welcome form{text-align:left;max-width:380px;margin:0 auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
.confirm-box{display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
input[type=number],input[type=time]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
.subtabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.subtabs button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;min-height:38px}
.subtabs button[aria-selected="true"]{background:var(--wine);color:#fff}
.subtabs .count{display:inline-block;background:var(--bad);color:#fff;border-radius:999px;font-size:10.5px;padding:0 6px;margin-left:2px}
.summary b.m{font-size:17px}
.money{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.me-pill{background:var(--gold-soft);color:var(--gold-ink)}
.ce-cotizado{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.ce-confirmado{background:var(--info-soft);color:var(--info)}
.ce-realizado{background:var(--warn-soft);color:var(--warn)}
.ce-pagado{background:var(--ok-soft);color:var(--ok)}
.ce-cancelado{background:var(--bad-soft);color:var(--bad)}
.conteo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.den{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.den input[type=number]{min-height:38px;padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums}
.live-total{display:flex;flex-wrap:wrap;gap:6px 16px;background:var(--gold-soft);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--ink)}
.live-total b{font-variant-numeric:tabular-nums}
.costos{display:flex;flex-direction:column;gap:8px}
.costo-row{display:grid;grid-template-columns:minmax(0,1fr) 112px 44px;gap:6px}
.tbl-wrap{overflow-x:auto}
table.money-tbl,table.kt{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.money-tbl td{padding:6px 0;border-bottom:1px solid var(--line)}
.money-tbl td.num{text-align:right;white-space:nowrap;padding-left:10px}
.money-tbl tr.sub td{font-weight:600}
.money-tbl tr.total td{font-weight:800;font-size:16px;border-bottom:0;color:var(--wine-ink)}
.money-tbl td.neg,.neg{color:var(--bad)}
.att{display:flex;flex-wrap:wrap;gap:6px}
.att-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.g-tuno{background:var(--gold)}.dot.g-pardillo{background:var(--wine-ink)}.dot.g-aspirante{background:var(--info)}
.muted-p{margin:0;color:var(--muted);font-size:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{display:block;font-size:21px;line-height:1.15;margin:3px 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{font-size:12px;color:var(--muted)}
.kpi.hero{grid-column:1/-1;background:var(--head);border-color:var(--head);color:var(--on-head)}
.kpi.hero span,.kpi.hero small{color:var(--on-head);opacity:.85}
.kpi.hero b{font-size:30px}
.chart{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--muted);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart-note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.rank{display:flex;flex-direction:column;gap:7px}
.rank-row{display:grid;grid-template-columns:92px minmax(0,1fr) 26px;gap:8px;align-items:center;font-size:13px}
.rank-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-bar{display:flex;gap:2px;height:14px}
.rank-bar span{display:block;height:100%;border-radius:3px}
.rank-n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
table.kt th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
table.kt td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line)}
table.kt .num{text-align:right}
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:7px 10px;border-radius:8px;white-space:pre-line;max-width:230px;line-height:1.35}
.export-row{display:flex;gap:8px;flex-wrap:wrap}
.hdr-btn{position:relative;flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:10px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff5e1;cursor:pointer}
.hdr-btn[aria-pressed="true"]{background:#c8941b;border-color:#c8941b;color:#2b1a00}
.hdr-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.hdr-btn .badge{top:-5px;left:auto;right:-5px}
.seg.seg2{grid-template-columns:1fr 1fr}
.person{flex-wrap:wrap;row-gap:8px}
.person .info{flex:1 1 calc(100% - 120px)}
.person select,.person .btn{flex:none}
.person select:first-of-type,.person .grado + .btn{margin-left:46px}
@media (max-width:380px){.summary b{font-size:19px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <img src="logo.png" alt="Escudo de la Tuna UTAL">
    <div class="brand"><h1>Tuna UTAL</h1><small>Planificador de tareas · Beta</small></div>
    <div class="me-chip" id="meChip"></div>
    <button class="hdr-btn" id="hdrPeople" data-nav="gente" hidden aria-label="Integrantes"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7M16 4a4 4 0 0 1 0 8M22 21c0-3-2-6-5-6.5"/></svg><span class="badge" id="hdrBadge" hidden></span></button>
  </div>
</header>
<main class="wrap" id="app">
  <div class="empty" id="boot"><strong>Cargando las tareas de la Tuna…</strong>Un momento mientras se conecta.</div>
</main>
<button class="fab" id="fab" hidden aria-label="Nueva tarea">+</button>
<nav class="bottom" id="nav" hidden><div class="wrap" id="navInner"></div></nav>
<div id="layer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
const AGRUPACION = "tuna-utal"; // preparado para sumar otra agrupación (la tuna ahijada) más adelante
const CATS = ["Ensayos","Presentaciones y serenatas","Viajes y certámenes","Finanzas y cuotas","Vestuario e instrumentos","Redes y difusión","Organización interna","Otra"];
const ESTADOS = {pendiente:"Pendiente", en_curso:"En curso", realizada:"Realizada"};
const PRIOS = {alta:"Alta", media:"Media", baja:"Baja"};
const GRADOS = {tuno:"Tuno", pardillo:"Pardillo", aspirante:"Aspirante"};
const TIPOS_CONTRATO = ["Serenata","Matrimonio","Cumpleaños","Evento institucional","Evento privado","Otro"];
const ESTADOS_CONTRATO = {cotizado:"Cotizado",confirmado:"Confirmado",realizado:"Realizado",pagado:"Pagado",cancelado:"Cancelado"};
const CONCEPTOS = ["Transporte","Alimentación","Vestuario","Cuerdas e instrumentos","Equipo de sonido","Comisión","Otro"];
const DENOMS = [20000,10000,5000,2000,1000,500,100,50,10]; // billetes y monedas chilenas
const MESES_L = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["dom","lun","mar","mié","jue","vie","sáb"];
const clp = n=>(n<0?"−$":"$")+Math.abs(Math.round(+n||0)).toLocaleString("es-CL");
const sum = (a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const parcheTotal = p=>DENOMS.reduce((s,d)=>s+d*(+((p.conteo||{})["d"+d])||0),0)+(+p.otro||0);
const parcheNeto = p=>parcheTotal(p)-(+p.gastos||0);
const costosTotal = c=>sum(c.costos||[],x=>x.monto);
const contratoUtil = c=>(+c.monto||0)-costosTotal(c);

const S = {db:null,user:null,myId:null,isOwner:false,members:{},tasks:[],requests:[],profiles:{},
  parches:[],contratos:[],llamados:[],respuestas:[],dl:null,view:"tareas",tareasTab:"mias",kpiPeriodo:"6m",
  filterEstado:"activas",filterCat:"",filterPersona:"",sheet:null,ready:{m:false,t:false,p:false,c:false,l:false},error:null,myRequest:null};

const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function daysBetween(a,b){const [y1,m1,d1]=a.split("-").map(Number),[y2,m2,d2]=b.split("-").map(Number);return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/864e5)}
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fmtDate(s){if(!s)return"—";const [y,m,d]=s.split("-").map(Number);return d+" "+MESES[m-1]+(y!==new Date().getFullYear()?" "+y:"")}
function fmtTs(iso){try{const d=new Date(iso);return d.getDate()+" "+MESES[d.getMonth()]+", "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}catch(e){return""}}
function dueInfo(t){if(!t.fechaLimite)return{txt:"Sin fecha",cls:""};if(t.estado==="realizada")return{txt:"Límite "+fmtDate(t.fechaLimite),cls:""};
  const n=daysBetween(todayStr(),t.fechaLimite);
  if(n<0)return{txt:"Vencida hace "+(-n)+(n===-1?" día":" días"),cls:"late"};
  if(n===0)return{txt:"Vence hoy",cls:"soon"}; if(n===1)return{txt:"Vence mañana",cls:"soon"};
  return{txt:"Vence "+fmtDate(t.fechaLimite)+" · "+n+" días",cls:n<=3?"soon":""}}
function toast(msg){const el=document.createElement("div");el.className="toast";el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}

// ---------- personas y permisos ----------
const me = ()=>S.members[S.myId]||null;
const grado = id=>S.members[id]?.grado||null;
function nameOf(id){const m=S.members[id];if(m&&m.apodo)return m.apodo;return (S.profiles[id]&&S.profiles[id].name)||"Integrante"}
function initials(n){return n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?"}
function canAssignTo(target){const g=me()?.grado,tg=grado(target);if(!g||!tg)return false;if(g==="tuno")return true;if(g==="pardillo")return tg==="pardillo"||tg==="aspirante";return false}
const canCreate = ()=>["tuno","pardillo"].includes(me()?.grado);
const isAssigned = t=>(t.asignados||[]).includes(S.myId);
function canState(t){const g=me()?.grado;if(g==="tuno"||g==="pardillo")return true;return g==="aspirante"&&isAssigned(t)}
const canNote = canState;
function canEdit(t){return me()?.grado==="tuno"||t.creadoPor===S.myId}
const isTuno = ()=>me()?.grado==="tuno";
// gestionan integrantes: tú (dueño) y los tunos con acceso de edición al enlace
const msOf = f=>{const [y,m,d]=String(f).split("-").map(Number);return Date.UTC(y,m-1,d,3)};
const ingresoDe = id=>{const m=S.members[id]||{};return m.ingreso||(m.desde||"").slice(0,10)};
function antiguedadOk(id){const m=S.members[id];if(!m)return false;if(m.grado!=="aspirante")return true;
  const ing=ingresoDe(id);if(!ing)return false;const d=new Date();d.setMonth(d.getMonth()-2);
  const lim=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");return ing<=lim}
const canManage = ()=>isTuno();
function plazoCheck(t){
  const g=me()?.grado;
  if(!(g==="pardillo"||g==="aspirante")||!isAssigned(t))return {show:false};
  if(t.estado==="realizada")return {show:false};
  if(t.solicitudPlazo&&t.solicitudPlazo.estado==="pendiente")return {show:true,ok:false,why:"Ya hay una solicitud de plazo esperando respuesta."};
  const orig=t.fechaLimiteOriginal||t.fechaLimite;
  if(orig&&daysBetween(todayStr(),orig)<0)return {show:true,ok:false,why:"El plazo original ("+fmtDate(orig)+") ya pasó, así que no se puede pedir una nueva fecha."};
  const nota=(t.notas||[]).find(n=>n.tipo==="requiere_plazo"&&n.autor===S.myId&&!n.usada);
  if(!nota)return {show:true,ok:false,why:"Primero agrega una nota marcando «Necesito más plazo» explicando por qué."};
  return {show:true,ok:true,nota};
}

// ---------- arranque ----------
// ---------- conexión con Firebase ----------
let unsubs=[],reqSub=false;
function unsubAll(){unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];reqSub=false}
const saveFile=async({filename,data})=>{const b=new Blob([data],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return {status:"saved"}};
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
async function boot(){
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey||String(cfg.apiKey).includes("PEGA")){S.error="Falta configurar Firebase: completa el archivo firebase-config.js siguiendo la guía.";render();return}
  firebase.initializeApp(cfg);
  const fs=firebase.firestore();
  try{fs.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
  S.db=fs;S.dl={save:saveFile};
  firebase.auth().getRedirectResult().catch(e=>{S.loginError="No se pudo iniciar sesión ("+(e.code||"error")+").";render()});
  firebase.auth().onAuthStateChanged(async u=>{
    unsubAll();
    Object.assign(S,{authChecked:true,authUser:u||null,myId:u?u.uid:null,members:{},tasks:[],parches:[],contratos:[],llamados:[],respuestas:[],requests:[],myRequest:null,isOwner:false,sheet:null,
      ready:{m:!u,t:false,p:false,c:false,l:false}});
    $("#layer").innerHTML="";render();
    if(!u)return;
    try{await fs.doc("adminCheck/"+u.uid).get();S.isOwner=true}catch(e){S.isOwner=false}
    let full=false;
    unsubs.push(fs.doc("miembros/"+u.uid).onSnapshot(s=>{
      if(s.exists&&!full){full=true;subscribeAll(fs)}
      else if(!s.exists){if(full){location.reload();return}S.members={};S.ready.m=true;render()}
    },e=>{S.error="No se pudo leer tu perfil ("+e.code+"). Revisa las reglas de Firestore.";render()}));
    unsubs.push(fs.doc("solicitudes/"+u.uid).onSnapshot(s=>{S.myRequest=s.exists?s.data():null;render()},()=>{}));
  });
}
function subscribeAll(fs){
  const mine=snap=>snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>(x.agrupacion||AGRUPACION)===AGRUPACION);
  unsubs.push(fs.collection("miembros").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{const v=d.data();if(v&&(v.agrupacion||AGRUPACION)===AGRUPACION)m[d.id]=v});
    S.members=m;S.ready.m=true;
    if(isTuno()&&!reqSub){reqSub=true;unsubs.push(fs.collection("solicitudes").onSnapshot(sn=>{S.requests=sn.docs.map(d=>({id:d.id,...d.data()}));loadProfiles();render()},()=>{}))}
    render()},e=>{S.error="No se pudo leer la lista de integrantes ("+e.code+").";render()}));
  unsubs.push(fs.collection("tareas").onSnapshot(snap=>{S.tasks=mine(snap);S.ready.t=true;render()},()=>{S.ready.t=true;render()}));
  unsubs.push(fs.collection("parches").onSnapshot(snap=>{S.parches=mine(snap);S.ready.p=true;render()},()=>{S.ready.p=true;render()}));
  unsubs.push(fs.collection("contratos").onSnapshot(snap=>{S.contratos=mine(snap);S.ready.c=true;render()},()=>{S.ready.c=true;render()}));
  // llamados y respuestas: solo los últimos 90 días, para cuidar el límite gratuito de lecturas
  const cut=daysAgo(90);
  unsubs.push(fs.collection("llamados").where("fecha",">=",cut).onSnapshot(snap=>{S.llamados=mine(snap);S.ready.l=true;render()},()=>{S.ready.l=true;render()}));
  unsubs.push(fs.collection("respuestas").where("fechaLlamado",">=",cut).onSnapshot(snap=>{S.respuestas=mine(snap);render()},()=>{}));
}
function loadProfiles(){S.requests.forEach(r=>{S.profiles[r.id]={name:r.nombre||""}})}

// ---------- render ----------
function render(){
  const app=$("#app");
  const m=me();
  $("#meChip").innerHTML=m?`<b>${esc(m.apodo||nameOf(S.myId))}</b><span class="grado g-${m.grado}">${GRADOS[m.grado]}</span>`:"";
  if(S.error){app.innerHTML=`<div class="empty"><strong>No se pudo abrir el planificador</strong>${esc(S.error)}</div>`;hideChrome();return}
  if(!S.authChecked)return;
  if(!S.authUser){hideChrome();app.innerHTML=loginView();return}
  if(!S.ready.m){return}
  if(!m){hideChrome();app.innerHTML=S.isOwner?ownerSetup():joinView();return}
  showChrome();
  if(S.view==="tareas")app.innerHTML=viewTareas();
  else if(S.view==="llamados")app.innerHTML=viewLlamados();
  else if(S.view==="parches")app.innerHTML=viewParches();
  else if(S.view==="contratos")app.innerHTML=viewContratos();
  else if(S.view==="kpi")app.innerHTML=viewKpi();
  else if(S.view==="gente")app.innerHTML=viewPeople();
  renderSheet();
}
function hideChrome(){$("#nav").hidden=true;$("#fab").hidden=true;$("#hdrPeople").hidden=true}
function showChrome(){
  $("#nav").hidden=false;
  const fabOn=S.view==="tareas"?canCreate():["parches","contratos","llamados"].includes(S.view)?isTuno():false;
  $("#fab").hidden=!fabOn;$("#fab").setAttribute("aria-label",S.view==="parches"?"Nuevo parche":S.view==="contratos"?"Nuevo contrato":S.view==="llamados"?"Nuevo llamado":"Nueva tarea");
  const pend=S.tasks.filter(t=>t.solicitudPlazo&&t.solicitudPlazo.estado==="pendiente").length;
  const ic={tareas:'<svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>',
    llamados:'<svg viewBox="0 0 24 24"><path d="M3 10v4h3l7 5V5l-7 5z"/><path d="M16.5 9a4 4 0 0 1 0 6M19.5 6.5a8 8 0 0 1 0 11"/></svg>',
    parches:'<svg viewBox="0 0 24 24"><ellipse cx="9" cy="6.5" rx="6" ry="2.5"/><path d="M3 6.5v4c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-4M3 10.5v4c0 1.4 2.7 2.5 6 2.5"/><circle cx="17" cy="16" r="4.5"/></svg>',
    contratos:'<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
    kpi:'<svg viewBox="0 0 24 24"><path d="M5 20V11M11 20V5M17 20v-6M2 20h20"/></svg>',
    gente:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7M16 4a4 4 0 0 1 0 8M22 21c0-3-2-6-5-6.5"/></svg>'};
  const items=[["tareas","Tareas"],["llamados","Llamados"],["parches","Parches"],["contratos","Contratos"],["kpi","Indicadores"]];
  const pendL=S.llamados.filter(l=>llamadoAbierto(l)&&!miResp(l.id)).length;
  const reqBadge=canManage()&&S.requests.length?S.requests.length:0;
  const hp=$("#hdrPeople");hp.hidden=false;hp.setAttribute("aria-pressed",S.view==="gente");const hb=$("#hdrBadge");hb.hidden=!reqBadge;hb.textContent=reqBadge;
  $("#navInner").innerHTML=items.map(([k,l])=>`<button data-nav="${k}" ${S.view===k?'aria-current="page"':""}>${ic[k]}${l}${k==="tareas"&&pend&&isTuno()?`<span class="badge">${pend}</span>`:""}${k==="llamados"&&pendL?`<span class="badge">${pendL}</span>`:""}</button>`).join("");
}

function taskCard(t){
  const d=dueInfo(t);const asg=(t.asignados||[]).map(nameOf).join(", ")||"Sin asignar";
  const subs=S.tasks.filter(x=>x.padre===t.id).length;
  return `<button class="task p-${esc(t.prioridad||"media")} ${t.estado==="realizada"?"done":""}" data-open="${esc(t.id)}">
    <span class="stripe"></span><span class="body">
      <span class="row"><span class="cat">${esc(t.categoria||"Otra")}</span><span class="pill st-${esc(t.estado)}">${ESTADOS[t.estado]||"Pendiente"}</span>${t.solicitudPlazo&&t.solicitudPlazo.estado==="pendiente"?'<span class="pill pl-pend">Plazo solicitado</span>':""}</span>
      <h3>${esc(t.titulo)}</h3>
      <span class="meta"><span class="due ${d.cls}">${d.txt}</span><span>👤 ${esc(asg)}</span>${subs?`<span>${subs} subtarea${subs>1?"s":""}</span>`:""}</span>
    </span></button>`}
function sortTasks(arr){const pr={alta:0,media:1,baja:2};return arr.slice().sort((a,b)=>{
  if((a.estado==="realizada")!==(b.estado==="realizada"))return a.estado==="realizada"?1:-1;
  return (a.fechaLimite||"9999").localeCompare(b.fechaLimite||"9999")||(pr[a.prioridad]??1)-(pr[b.prioridad]??1)})}
function applyFilters(arr){return arr.filter(t=>{
  if(S.filterEstado==="activas"&&t.estado==="realizada")return false;
  if(S.filterEstado==="realizada"&&t.estado!=="realizada")return false;
  if(S.filterEstado==="vencidas"&&!(t.estado!=="realizada"&&t.fechaLimite&&daysBetween(todayStr(),t.fechaLimite)<0))return false;
  if(S.filterCat&&t.categoria!==S.filterCat)return false;
  if(S.filterPersona&&!(t.asignados||[]).includes(S.filterPersona))return false;
  return true})}
function filterBar(withPerson){
  const est=[["activas","Activas"],["vencidas","Vencidas"],["realizada","Realizadas"],["todas","Todas"]];
  return `<div class="filters">${est.map(([k,l])=>`<button class="chip" data-fest="${k}" aria-pressed="${S.filterEstado===k}">${l}</button>`).join("")}
    <select class="chip" id="fcat" aria-label="Filtrar por categoría"><option value="">Todas las categorías</option>${CATS.map(c=>`<option ${S.filterCat===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
    ${withPerson?`<select class="chip" id="fper" aria-label="Filtrar por integrante"><option value="">Todos los integrantes</option>${Object.keys(S.members).sort((a,b)=>nameOf(a).localeCompare(nameOf(b))).map(id=>`<option value="${esc(id)}" ${S.filterPersona===id?"selected":""}>${esc(nameOf(id))}</option>`).join("")}</select>`:""}
  </div>`}
function groupedList(arr,emptyHtml){
  if(!S.ready.t)return `<div class="empty"><strong>Cargando tareas…</strong></div>`;
  if(!arr.length)return emptyHtml;
  return `<div class="list">${sortTasks(arr).map(taskCard).join("")}</div>`}

function viewMine(){
  const mine=S.tasks.filter(isAssigned);
  const act=mine.filter(t=>t.estado!=="realizada");
  const late=act.filter(t=>t.fechaLimite&&daysBetween(todayStr(),t.fechaLimite)<0).length;
  const week=act.filter(t=>t.fechaLimite&&daysBetween(todayStr(),t.fechaLimite)>=0&&daysBetween(todayStr(),t.fechaLimite)<=7).length;
  const created=S.tasks.filter(t=>t.creadoPor===S.myId&&!isAssigned(t)&&t.estado!=="realizada");
  return `<div class="section-head"><h2>Mis tareas</h2><span>${fmtDate(todayStr())}</span></div>
   <div class="summary"><div><b>${act.length}</b><span>activas</span></div><div><b>${week}</b><span>vencen en 7 días</span></div><div class="${late?"alert":""}"><b>${late}</b><span>vencidas</span></div></div>
   ${filterBar(false)}
   ${groupedList(applyFilters(mine),`<div class="empty"><strong>No tienes tareas en esta vista</strong>${canCreate()?"Toca el botón dorado + para crear una tarea y asignarla.":"Cuando un tuno o pardillo te asigne una tarea, aparecerá aquí."}</div>`)}
   ${created.length?`<p class="group-label">Asignadas por ti a otros</p><div class="list">${sortTasks(created).map(taskCard).join("")}</div>`:""}`}
function viewAll(){
  const arr=applyFilters(S.tasks);
  return `<div class="section-head"><h2>Tareas de la Tuna</h2><span>${S.tasks.filter(t=>t.estado!=="realizada").length} activas</span></div>
   ${filterBar(true)}
   ${groupedList(arr,`<div class="empty"><strong>No hay tareas en esta vista</strong>${S.tasks.length?"Prueba con otro filtro.":"Aún no se ha creado ninguna tarea."}</div>`)}`}
function viewPlazos(){
  const pend=S.tasks.filter(t=>t.solicitudPlazo&&t.solicitudPlazo.estado==="pendiente");
  return `<div class="section-head"><h2>Solicitudes de plazo</h2><span>${pend.length} pendiente${pend.length===1?"":"s"}</span></div>
  ${pend.length?pend.map(t=>{const s=t.solicitudPlazo;return `<div class="block"><h4>${esc(t.titulo)}</h4>
    <dl class="kv"><dt>Pide</dt><dd>${esc(nameOf(s.por))} (${GRADOS[grado(s.por)]||""})</dd><dt>Fecha actual</dt><dd>${fmtDate(t.fechaLimite)}</dd><dt>Nueva fecha</dt><dd><b>${fmtDate(s.nuevaFecha)}</b></dd><dt>Motivo</dt><dd>${esc(s.motivo)}</dd></dl>
    <div class="btn-row" style="margin-top:12px"><button class="btn small gold" data-plazo-ok="${esc(t.id)}">Aprobar</button><button class="btn small danger" data-plazo-no="${esc(t.id)}">Rechazar</button><button class="btn small" data-open="${esc(t.id)}">Ver tarea</button></div></div>`}).join("")
  :`<div class="empty"><strong>No hay solicitudes pendientes</strong>Cuando un pardillo o aspirante pida más plazo, lo verás aquí para aprobarlo o rechazarlo.</div>`}`}
function viewTareas(){
  const tabs=[["mias","Mis tareas"],["todas","Todas"]];if(isTuno())tabs.push(["plazos","Plazos"]);
  if(S.tareasTab==="plazos"&&!isTuno())S.tareasTab="mias";
  const pend=S.tasks.filter(t=>t.solicitudPlazo&&t.solicitudPlazo.estado==="pendiente").length;
  const bar=`<div class="subtabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tareasTab===k}">${l}${k==="plazos"&&pend?`<span class="count">${pend}</span>`:""}</button>`).join("")}</div>`;
  return bar+(S.tareasTab==="mias"?viewMine():S.tareasTab==="todas"?viewAll():viewPlazos())}

// ---------- parches y contratos ----------
const loadingHtml=`<div class="empty"><strong>Cargando…</strong></div>`;
const att=e=>(e.asistentes||[]).length;
function fmtDateDia(s){if(!s)return"—";const [y,m,d]=s.split("-").map(Number);return DIAS[new Date(Date.UTC(y,m-1,d)).getUTCDay()]+" "+fmtDate(s)}
const esProgramado=p=>!!p.fecha&&(p.fecha>todayStr()||(p.fecha===todayStr()&&!parcheTotal(p)));
const contratoAbierto=c=>(c.fecha||"")>=todayStr()&&!["cancelado","realizado","pagado"].includes(c.estado);
const byFecha=(a,b)=>(a.fecha||"").localeCompare(b.fecha||"");

function parcheCard(p){const prog=esProgramado(p),n=att(p),yo=(p.asistentes||[]).includes(S.myId);
  return `<button class="task" data-parche="${esc(p.id)}"><span class="stripe" style="background:var(--s-parche)"></span><span class="body">
    <span class="row"><span class="cat">${fmtDateDia(p.fecha)}${p.hora?" · "+esc(p.hora):""}</span>${prog?'<span class="pill st-en_curso">Programado</span>':parcheTotal(p)?'<span class="pill st-realizada">Contado</span>':'<span class="pill pl-pend">Sin conteo</span>'}${yo?'<span class="pill me-pill">Vas</span>':""}</span>
    <h3>${esc(p.lugar||"Parche")}</h3>
    <span class="meta"><span>${n} asistente${n===1?"":"s"}</span>${prog?"":`<span class="money">${clp(parcheNeto(p))} neto</span>${n?`<span>${clp(parcheNeto(p)/n)} c/u</span>`:""}`}</span></span></button>`}
function contratoCard(c){const n=att(c),yo=(c.asistentes||[]).includes(S.myId);
  return `<button class="task" data-contrato="${esc(c.id)}"><span class="stripe" style="background:var(--s-contrato)"></span><span class="body">
    <span class="row"><span class="cat">${esc(c.tipo||"Otro")}</span><span class="pill ce-${esc(c.estado)}">${ESTADOS_CONTRATO[c.estado]||""}</span>${yo?'<span class="pill me-pill">Vas</span>':""}</span>
    <h3>${esc(c.cliente||"Contrato")}</h3>
    <span class="meta"><span>${fmtDateDia(c.fecha)}${c.hora?" · "+esc(c.hora):""}</span><span>${n} integrante${n===1?"":"s"}</span><span class="money">${clp(c.monto)}</span>${costosTotal(c)?`<span>Utilidad ${clp(contratoUtil(c))}</span>`:""}</span></span></button>`}

function viewParches(){
  if(!S.ready.p)return loadingHtml;
  const mes=todayStr().slice(0,7);
  const prox=S.parches.filter(esProgramado).sort(byFecha);
  const hechos=S.parches.filter(p=>!esProgramado(p)).sort((a,b)=>byFecha(b,a));
  const mesP=hechos.filter(p=>(p.fecha||"").startsWith(mes));const neto=sum(mesP,parcheNeto),a=sum(mesP,att);
  let h=`<div class="section-head"><h2>Parches</h2><span>${MESES_L[+mes.slice(5)-1]}</span></div>
  <div class="summary"><div><b class="m">${clp(neto)}</b><span>neto del mes</span></div><div><b>${mesP.length}</b><span>parches del mes</span></div><div><b class="m">${a?clp(neto/a):"—"}</b><span>por asistente</span></div></div>`;
  if(!S.parches.length)return h+`<div class="empty"><strong>Aún no hay parches registrados</strong>${isTuno()?"Toca el botón dorado + para programar un parche o registrar el conteo de uno que ya se hizo.":"Cuando un tuno programe un parche, aparecerá aquí para que te anotes."}</div>`;
  if(prox.length)h+=`<p class="group-label">Próximos · anótate</p><div class="list">${prox.map(parcheCard).join("")}</div>`;
  if(hechos.length)h+=`<p class="group-label">Realizados</p><div class="list">${hechos.map(parcheCard).join("")}</div>`;
  return h}
function viewContratos(){
  if(!S.ready.c)return loadingHtml;
  const y=todayStr().slice(0,4);
  const prox=S.contratos.filter(contratoAbierto).sort(byFecha);
  const resto=S.contratos.filter(c=>!contratoAbierto(c)).sort((a,b)=>byFecha(b,a));
  const anio=S.contratos.filter(c=>(c.fecha||"").startsWith(y)&&(c.estado==="realizado"||c.estado==="pagado"));
  const porCobrar=sum(S.contratos.filter(c=>c.estado==="realizado"),c=>c.monto);
  let h=`<div class="section-head"><h2>Contratos</h2><span>${y}</span></div>
  <div class="summary"><div><b class="m">${clp(sum(anio,contratoUtil))}</b><span>utilidad del año</span></div><div><b>${anio.length}</b><span>realizados</span></div><div class="${porCobrar?"alert":""}"><b class="m">${clp(porCobrar)}</b><span>por cobrar</span></div></div>`;
  if(!S.contratos.length)return h+`<div class="empty"><strong>Aún no hay contratos</strong>${isTuno()?"Toca el botón dorado + para registrar un contrato con su monto y costos.":"Cuando un tuno registre un contrato, aparecerá aquí para que te anotes."}</div>`;
  if(prox.length)h+=`<p class="group-label">Próximos · anótate</p><div class="list">${prox.map(contratoCard).join("")}</div>`;
  if(resto.length)h+=`<p class="group-label">Historial</p><div class="list">${resto.map(contratoCard).join("")}</div>`;
  return h}

function asistentesBlock(ev,kind){const ids=ev.asistentes||[],yo=ids.includes(S.myId);
  const abierto=kind==="parche"?esProgramado(ev):contratoAbierto(ev);
  return `<div class="block"><h4>${abierto?"Anotados":"Asistieron"} · ${ids.length}</h4>
  ${ids.length?`<div class="att">${ids.map(id=>`<span class="att-chip"><span class="dot g-${grado(id)||"x"}"></span>${esc(nameOf(id))}</span>`).join("")}</div>`:`<p class="muted-p">Nadie anotado todavía.</p>`}
  ${!abierto?"":yo||antiguedadOk(S.myId)?`<button class="btn small ${yo?"":"gold"}" style="margin-top:10px" data-anotar="${kind}:${esc(ev.id)}">${yo?"Ya no voy":"Anotarme"}</button>`:`<p class="muted-p" style="margin-top:10px">Llevas menos de 2 meses como aspirante: un tuno debe sumarte.</p>`}</div>`}
function parcheDetail(p){
  const tot=parcheTotal(p),g=+p.gastos||0,neto=tot-g,n=att(p),prog=esProgramado(p),ct=p.conteo||{};
  const rows=DENOMS.filter(d=>+ct["d"+d]).map(d=>`<tr><td>${d>=1000?"Billetes":"Monedas"} de ${clp(d)}</td><td class="num">× ${ct["d"+d]}</td><td class="num">${clp(d*ct["d"+d])}</td></tr>`).join("");
  return `<h2>${esc(p.lugar||"Parche")}</h2>
  <div class="block"><dl class="kv"><dt>Fecha</dt><dd>${fmtDateDia(p.fecha)}${p.hora?", "+esc(p.hora):""}</dd><dt>Registrado por</dt><dd>${esc(nameOf(p.creadoPor))}</dd></dl>${p.notas?`<p class="desc" style="margin-top:10px">${esc(p.notas)}</p>`:""}</div>
  ${prog&&!tot?`<div class="callout info">Parche programado. Al terminar, un tuno registra el conteo del dinero con «Editar».</div>`:
  `<div class="block"><h4>Conteo del dinero</h4><div class="tbl-wrap"><table class="money-tbl"><tbody>${rows}
    ${+p.otro?`<tr><td>Otros / ajuste</td><td></td><td class="num">${clp(p.otro)}</td></tr>`:""}
    <tr class="sub"><td>Total recaudado</td><td></td><td class="num">${clp(tot)}</td></tr>
    ${g?`<tr><td>Gastos${p.gastosDetalle?" ("+esc(p.gastosDetalle)+")":""}</td><td></td><td class="num neg">− ${clp(g)}</td></tr>`:""}
    <tr class="total"><td>Neto</td><td></td><td class="num">${clp(neto)}</td></tr>
    ${n?`<tr><td>Por asistente (${n})</td><td></td><td class="num">${clp(neto/n)}</td></tr>`:""}</tbody></table></div></div>`}
  ${asistentesBlock(p,"parche")}
  ${isTuno()?`<div class="btn-row"><button class="btn" data-edit-parche="${esc(p.id)}">${prog?"Editar / registrar conteo":"Editar"}</button><button class="btn danger" data-del-parche="${esc(p.id)}">Eliminar</button></div>`:""}`}
function contratoDetail(c){const cost=costosTotal(c),u=contratoUtil(c),n=att(c),m=+c.monto||0;
  return `<h2>${esc(c.cliente||"Contrato")}</h2>
  <div class="block"><dl class="kv"><dt>Tipo</dt><dd>${esc(c.tipo||"Otro")}</dd><dt>Estado</dt><dd><span class="pill ce-${esc(c.estado)}">${ESTADOS_CONTRATO[c.estado]||""}</span></dd>
    <dt>Fecha</dt><dd>${fmtDateDia(c.fecha)}${c.hora?", "+esc(c.hora):""}</dd>${c.lugar?`<dt>Lugar</dt><dd>${esc(c.lugar)}</dd>`:""}${c.contacto?`<dt>Contacto</dt><dd>${esc(c.contacto)}</dd>`:""}
    <dt>Registrado por</dt><dd>${esc(nameOf(c.creadoPor))}</dd></dl>${c.notas?`<p class="desc" style="margin-top:10px">${esc(c.notas)}</p>`:""}</div>
  <div class="block"><h4>Costeo</h4><div class="tbl-wrap"><table class="money-tbl"><tbody>
    <tr class="sub"><td>Monto cobrado</td><td class="num">${clp(m)}</td></tr>
    ${(c.costos||[]).map(x=>`<tr><td>${esc(x.concepto||"Costo")}</td><td class="num neg">− ${clp(x.monto)}</td></tr>`).join("")}
    <tr class="sub"><td>Total costos</td><td class="num">${clp(cost)}</td></tr>
    <tr class="total"><td>Utilidad</td><td class="num ${u<0?"neg":""}">${clp(u)}</td></tr>
    ${m?`<tr><td>Margen</td><td class="num">${Math.round(u/m*100)}%</td></tr>`:""}
    ${n?`<tr><td>Por integrante (${n})</td><td class="num">${clp(u/n)}</td></tr>`:""}</tbody></table></div></div>
  ${asistentesBlock(c,"contrato")}
  ${isTuno()?`<div class="btn-row"><button class="btn" data-edit-contrato="${esc(c.id)}">Editar</button><button class="btn danger" data-del-contrato="${esc(c.id)}">Eliminar</button></div>`:""}`}

function membersChecks(sel,label){const ids=Object.keys(S.members).sort((a,b)=>nameOf(a).localeCompare(nameOf(b)));
  return `<div class="field"><label>${label}</label><div class="checks">${ids.map(id=>`<label><input type="checkbox" name="asis" value="${esc(id)}" ${(sel||[]).includes(id)?"checked":""}> ${esc(nameOf(id))}${id===S.myId?" (tú)":""} <span class="grado g-${grado(id)}" style="margin-left:auto">${GRADOS[grado(id)]}</span></label>`).join("")}</div></div>`}

    <div class="field"><label for="pGastos">Gastos ($)</label><input type="number" inputmode="numeric" min="0" id="pGastos" value="${+v.gastos||""}" placeholder="0"></div></div>
  <div class="field"><label for="pGastosDet">Detalle de gastos</label><input type="text" id="pGastosDet" maxlength="80" value="${esc(v.gastosDetalle)}" placeholder="Ej: bebidas, estacionamiento"></div>

  <div class="field"><label for="pNotas">Notas</label><textarea id="pNotas" maxlength="500">${esc(v.notas)}</textarea></div>
  <button class="btn primary" type="submit">${p?"Guardar cambios":"Registrar parche"}</button></form>`}
const costoRow=c=>`<div class="costo-row"><input type="text" data-costo-concepto list="conceptos" maxlength="40" value="${esc((c||{}).concepto||"")}" placeholder="Concepto" aria-label="Concepto del costo"><input type="number" inputmode="numeric" min="0" data-costo-monto value="${(c||{}).monto||""}" placeholder="$" aria-label="Monto del costo"><button type="button" class="btn small" data-costo-del aria-label="Quitar costo">✕</button></div>`;

  const v=c||{cliente:"",tipo:TIPOS_CONTRATO[0],estado:"cotizado",fecha:"",hora:"",lugar:"",contacto:"",monto:"",costos:[{concepto:"Transporte"}],asistentes:[],notas:""};

  <div class="two"><div class="field"><label for="cFecha">Fecha</label><input type="date" id="cFecha" required value="${esc(v.fecha)}"></div><div class="field"><label for="cHora">Hora</label><input type="time" id="cHora" value="${esc(v.hora)}"></div></div>

  <div class="field"><label for="cMonto">Monto cobrado ($)</label><input type="number" inputmode="numeric" min="0" id="cMonto" required value="${esc(v.monto)}" placeholder="Ej: 250000"></div>

    <button type="button" class="btn small" data-costo-add style="align-self:flex-start">+ Agregar costo</button></div>
  <datalist id="conceptos">${CONCEPTOS.map(x=>`<option value="${x}"></option>`).join("")}</datalist>

function updateLive(){
  const pf=$("#parcheForm");if(pf&&$("#pLive")){let t=0;pf.querySelectorAll("[data-den]").forEach(i=>t+=(+i.value||0)*+i.dataset.den);t+=+$("#pOtro").value||0;
    const g=+$("#pGastos").value||0,n=pf.querySelectorAll("input[name=asis]:checked").length;
    $("#pLive").innerHTML=`<span>Total <b>${clp(t)}</b></span><span>Neto <b>${clp(t-g)}</b></span><span>Por asistente <b>${n?clp((t-g)/n):"—"}</b></span>`}
  const cf=$("#contratoForm");if(cf&&$("#cLive")){const m=+$("#cMonto").value||0;let c=0;cf.querySelectorAll("[data-costo-monto]").forEach(i=>c+=+i.value||0);
    const n=cf.querySelectorAll("input[name=asis]:checked").length;
    $("#cLive").innerHTML=`<span>Costos <b>${clp(c)}</b></span><span>Utilidad <b>${clp(m-c)}</b></span><span>Por integrante <b>${n?clp((m-c)/n):"—"}</b></span>`}}

// ---------- indicadores ----------
const pad2=n=>String(n).padStart(2,"0");
function periodStart(){const t=todayStr(),k=S.kpiPeriodo;if(k==="anio")return t.slice(0,4)+"-01-01";
  if(k==="todo"){const f=[...S.parches,...S.contratos].map(e=>e.fecha).filter(Boolean).sort()[0];return f&&f<t?f:t}
  let y=+t.slice(0,4),m=+t.slice(5,7)-(k==="3m"?2:5);while(m<1){m+=12;y--}return `${y}-${pad2(m)}-01`}
function monthKeys(){const s=periodStart(),t=todayStr().slice(0,7);let y=+s.slice(0,4),m=+s.slice(5,7);const out=[];
  while(`${y}-${pad2(m)}`<=t){out.push(`${y}-${pad2(m)}`);if(++m>12){m=1;y++}}return out.slice(-12)}
const fmtMoneyShort=v=>{const a=Math.abs(v),s=v<0?"−$":"$";return a>=1e6?s+String(+(a/1e6).toFixed(1)).replace(".",",")+"M":a>=1e3?s+Math.round(a/1e3)+"k":s+a};
const fmtCount=v=>String(+v.toFixed(1)).replace(".",",");
function niceUp(v){if(v<=0)return 0;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function frame(labels,vals,fmt){const W=360,H=190,pl=46,pr=6,pt=10,pb=24,iw=W-pl-pr,ih=H-pt-pb;
  let mx=niceUp(Math.max(0,...vals)),mn=-niceUp(-Math.min(0,...vals));if(!mx&&!mn)mx=1;
  const y=v=>pt+(mx-v)/(mx-mn)*ih;const ticks=[...new Set([mn,0,mx/2,mx])].filter(t=>t>=mn&&t<=mx);
  let g=ticks.map(t=>`<line class="${t===0?"zero":"grid"}" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"></line><text x="${pl-6}" y="${y(t)+3.5}" text-anchor="end">${fmt(t)}</text>`).join("");
  const gw=iw/labels.length,step=Math.ceil(labels.length/7);
  g+=labels.map((l,i)=>i%step?"":`<text x="${pl+gw*(i+.5)}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`).join("");
  return {W,H,pl,pt,ih,gw,y,g}}
const roundTop=(x,y,w,h,r)=>`M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`;
const roundBot=(x,y,w,h,r)=>`M${x},${y}H${x+w}V${y+h-r}Q${x+w},${y+h} ${x+w-r},${y+h}H${x+r}Q${x},${y+h} ${x},${y+h-r}Z`;
function barsChart(labels,series,fmt,tip){const F=frame(labels,series.flatMap(s=>s.values),fmt),ns=series.length;
  const bw=Math.max(4,Math.min(22,(F.gw-8-2*(ns-1))/ns)),gwid=bw*ns+2*(ns-1);let b="";
  labels.forEach((l,i)=>series.forEach((s,j)=>{const v=s.values[i];if(!v)return;const x=F.pl+F.gw*i+(F.gw-gwid)/2+j*(bw+2),y0=F.y(0),y1=F.y(v);
    const top=Math.min(y0,y1),h=Math.max(1,Math.abs(y1-y0)),r=Math.min(4,bw/2,h);
    b+=`<path d="${v>0?roundTop(x,top,bw,h,r):roundBot(x,top,bw,h,r)}" style="fill:${s.color}"></path>`}));
  b+=labels.map((l,i)=>`<rect x="${F.pl+F.gw*i}" y="${F.pt}" width="${F.gw}" height="${F.ih}" style="fill:transparent" data-tip="${esc(tip(i))}"></rect>`).join("");
  return `<svg class="chart" viewBox="0 0 ${F.W} ${F.H}" role="img" aria-label="Gráfico de barras">${F.g}${b}</svg>`}
function lineChart(labels,series,fmt,tip){const F=frame(labels,series.flatMap(s=>s.values),fmt);let o="";
  series.forEach(s=>{const pts=s.values.map((v,i)=>[F.pl+F.gw*(i+.5),F.y(v)]);
    o+=`<path d="${pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join("")}" style="fill:none;stroke:${s.color};stroke-width:2;stroke-linejoin:round"></path>`+
      pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" style="fill:${s.color};stroke:var(--surface);stroke-width:2"></circle>`).join("")});
  o+=labels.map((l,i)=>`<rect x="${F.pl+F.gw*i}" y="${F.pt}" width="${F.gw}" height="${F.ih}" style="fill:transparent" data-tip="${esc(tip(i))}"></rect>`).join("");
  return `<svg class="chart" viewBox="0 0 ${F.W} ${F.H}" role="img" aria-label="Gráfico de líneas">${F.g}${o}</svg>`}
function chartBlock(title,series,svg,note){return `<div class="block"><h4>${esc(title)}</h4>${series?`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`:""}${svg}${note?`<p class="chart-note">${esc(note)}</p>`:""}</div>`}
function exportBlock(){if(!isTuno()||!S.dl)return"";
  return `<div class="block"><h4>Descargar registros</h4><p class="chart-note" style="margin:0 0 10px">Archivos CSV con todos los parches y contratos, para abrir en Excel o Google Sheets.</p>
  <div class="export-row"><button class="btn small" data-export="parches">Parches (CSV)</button><button class="btn small" data-export="contratos">Contratos (CSV)</button></div></div>`}
function viewKpi(){
  if(!S.ready.p||!S.ready.c)return loadingHtml;
  const per=[["3m","3 meses"],["6m","6 meses"],["anio","Este año"],["todo","Todo"]],ini=periodStart(),hoy=todayStr();

function tareasKpi(ini,hoy){
  if(!isTuno())return"";
  const fin=t=>(t.completada||t.actualizado||t.fechaLimite||"").slice(0,10);
  const aTiempo=t=>t.aTiempo!=null?t.aTiempo:(!t.fechaLimite||fin(t)<=t.fechaLimite);
  const done=S.tasks.filter(t=>t.estado==="realizada"&&fin(t)>=ini&&fin(t)<=hoy),act=S.tasks.filter(t=>t.estado!=="realizada");
  const has=(t,id)=>(t.asignados||[]).includes(id);
  const rows=Object.keys(S.members).map(id=>{const d=done.filter(t=>has(t,id));return {id,d:d.length,ok:d.filter(aTiempo).length,a:act.filter(t=>has(t,id)).length,v:act.filter(t=>has(t,id)&&t.fechaLimite&&t.fechaLimite<hoy).length}});
  const okAll=done.filter(aTiempo).length;
  const mx=Math.max(1,...rows.map(r=>r.d)),top=rows.filter(r=>r.d).sort((a,b)=>b.d-a.d||nameOf(a.id).localeCompare(nameOf(b.id)));
  return `<p class="group-label">Tareas y misiones · solo tunos</p>
  <div class="kpis"><div class="kpi"><span>Tareas cumplidas</span><b>${done.length}</b><small>${done.filter(t=>t.padre).length} son subtareas</small></div>
    <div class="kpi"><span>Cumplidas a tiempo</span><b>${done.length?Math.round(okAll/done.length*100)+"%":"—"}</b><small>${okAll} de ${done.length}</small></div>
    <div class="kpi"><span>Activas ahora</span><b>${act.length}</b><small>sin completar</small></div>
    <div class="kpi"><span>Vencidas ahora</span><b class="${act.some(t=>t.fechaLimite&&t.fechaLimite<hoy)?"neg":""}">${act.filter(t=>t.fechaLimite&&t.fechaLimite<hoy).length}</b><small>pasaron su fecha límite</small></div></div>
  <div class="block"><h4>Cumplimiento por grado</h4><div class="tbl-wrap"><table class="kt"><thead><tr><th>Grado</th><th class="num">Cumplidas</th><th class="num">A tiempo</th><th class="num">Activas</th><th class="num">Vencidas</th></tr></thead><tbody>${
    ["tuno","pardillo","aspirante"].map(g=>{const r=rows.filter(x=>grado(x.id)===g),d=sum(r,x=>x.d),ok=sum(r,x=>x.ok);
      return `<tr><td>${GRADOS[g]}s</td><td class="num">${d}</td><td class="num">${d?Math.round(ok/d*100)+"%":"—"}</td><td class="num">${sum(r,x=>x.a)}</td><td class="num ${sum(r,x=>x.v)?"neg":""}">${sum(r,x=>x.v)}</td></tr>`}).join("")}</tbody></table></div>
    <p class="chart-note">Una tarea con varios responsables cuenta para cada uno.</p></div>
  <div class="block"><h4>Tareas cumplidas por integrante</h4>${top.length?`<div class="rank">${top.map(r=>`<div class="rank-row" data-tip="${esc(nameOf(r.id)+" ("+GRADOS[grado(r.id)]+")\nCumplidas: "+r.d+" · a tiempo: "+r.ok+"\nActivas: "+r.a+" · vencidas: "+r.v)}"><span class="rank-name">${esc(nameOf(r.id))}</span><span class="rank-bar"><span style="width:${r.d/mx*100}%;background:var(--info)"></span></span><span class="rank-n">${r.d}</span></div>`).join("")}</div>`:`<p class="muted-p">Nadie ha completado tareas en este período.</p>`}</div>`}

// ---------- hojas (detalle / formularios) ----------
function renderSheet(){
  const L=$("#layer");if(!S.sheet){L.innerHTML="";return}
  // no re-dibujar formularios abiertos mientras se escribe
  if(!["task","parche","contrato","llamado"].includes(S.sheet.type)&&L.firstChild)return;
  const scroll=L.querySelector(".sheet")?.scrollTop||0;
  const draft=L.querySelector("#noteText")?.value;
  let inner="";
  if(S.sheet.type==="task"){const t=S.tasks.find(x=>x.id===S.sheet.id);if(!t){S.sheet=null;L.innerHTML="";return}inner=taskDetail(t)}
  else if(S.sheet.type==="form")inner=taskForm(S.sheet);
  else if(S.sheet.type==="plazo")inner=plazoForm(S.tasks.find(x=>x.id===S.sheet.id));
  else if(S.sheet.type==="confirm")inner=confirmBox(S.sheet);
  else if(S.sheet.type==="parche"){const p=S.parches.find(x=>x.id===S.sheet.id);if(!p){S.sheet=null;L.innerHTML="";return}inner=parcheDetail(p)}
  else if(S.sheet.type==="contrato"){const c=S.contratos.find(x=>x.id===S.sheet.id);if(!c){S.sheet=null;L.innerHTML="";return}inner=contratoDetail(c)}
  else if(S.sheet.type==="llamado"){const l=S.llamados.find(x=>x.id===S.sheet.id);if(!l){S.sheet=null;L.innerHTML="";return}inner=llamadoDetail(l)}
  else if(S.sheet.type==="llamadoForm")inner=llamadoForm(S.sheet);
  else if(S.sheet.type==="parcheForm")inner=parcheForm(S.sheet);
  else if(S.sheet.type==="contratoForm")inner=contratoForm(S.sheet);
  L.innerHTML=`<div class="overlay" data-backdrop><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><button class="close" data-close aria-label="Cerrar">×</button>${inner}</div></div>`;
  const sh=L.querySelector(".sheet");if(sh)sh.scrollTop=scroll;
  if(draft&&L.querySelector("#noteText"))L.querySelector("#noteText").value=draft;
}
function openSheet(o){S.sheet=o;$("#layer").innerHTML="";renderSheet();updateLive()}
function closeSheet(){S.sheet=null;$("#layer").innerHTML=""}

function taskDetail(t){
  const d=dueInfo(t);const subs=S.tasks.filter(x=>x.padre===t.id);const parent=t.padre&&S.tasks.find(x=>x.id===t.padre);
  const pc=plazoCheck(t);const sp=t.solicitudPlazo&&t.solicitudPlazo.estado==="pendiente"?t.solicitudPlazo:null;
  const iAmAssignedLow=isAssigned(t)&&["pardillo","aspirante"].includes(me().grado);
  return `<h2>${esc(t.titulo)}</h2>
  <div class="block"><dl class="kv">
    <dt>Categoría</dt><dd>${esc(t.categoria||"Otra")}</dd>
    <dt>Prioridad</dt><dd>${PRIOS[t.prioridad]||"Media"}</dd>
    <dt>Fecha límite</dt><dd><span class="due ${d.cls}">${fmtDate(t.fechaLimite)}</span>${t.fechaLimiteOriginal&&t.fechaLimiteOriginal!==t.fechaLimite?` <span style="color:var(--muted);font-size:12.5px">(original: ${fmtDate(t.fechaLimiteOriginal)})</span>`:""}</dd>
    <dt>Asignada a</dt><dd>${(t.asignados||[]).map(id=>esc(nameOf(id))+` <span class="grado g-${grado(id)}">${GRADOS[grado(id)]||"?"}</span>`).join("<br>")||"Sin asignar"}</dd>
    <dt>Creada por</dt><dd>${esc(nameOf(t.creadoPor))}</dd>
    ${parent?`<dt>Parte de</dt><dd><a href="#" data-open="${esc(parent.id)}">${esc(parent.titulo)}</a></dd>`:""}
  </dl>${t.descripcion?`<p class="desc" style="margin-top:12px">${esc(t.descripcion)}</p>`:""}</div>
  <div class="block"><h4>Estado</h4>
    ${canState(t)?`<div class="seg">${Object.entries(ESTADOS).map(([k,l])=>`<button data-estado="${k}" aria-pressed="${t.estado===k}">${l}</button>`).join("")}</div>`:`<span class="pill st-${t.estado}">${ESTADOS[t.estado]}</span>`}
  </div>
  ${sp?`<div class="callout warn"><b>${esc(nameOf(sp.por))}</b> pidió cambiar la fecha a <b>${fmtDate(sp.nuevaFecha)}</b>. Motivo: ${esc(sp.motivo)}
     ${isTuno()?`<div class="btn-row" style="margin-top:8px"><button class="btn small gold" data-plazo-ok="${esc(t.id)}">Aprobar</button><button class="btn small danger" data-plazo-no="${esc(t.id)}">Rechazar</button></div>`:""}</div>`:""}
  ${pc.show?`<div class="block"><h4>Plazo</h4>${pc.ok?`<button class="btn gold" data-plazo-req="${esc(t.id)}">Solicitar nueva fecha</button>`:`<p style="margin:0;font-size:13.5px;color:var(--muted)">${esc(pc.why)}</p>`}</div>`:""}
  ${subs.length?`<div class="block"><h4>Subtareas</h4><div class="list">${sortTasks(subs).map(taskCard).join("")}</div></div>`:""}
  <div class="block"><h4>Información y avances</h4>
    <div class="notes">${(t.notas||[]).length?(t.notas||[]).map(n=>`<div class="note ${esc(n.tipo)}"><div class="who"><b>${esc(nameOf(n.autor))}</b> · ${fmtTs(n.fecha)}${n.tipo==="requiere_plazo"?" · necesita más plazo":""}</div><p>${esc(n.texto)}</p></div>`).join(""):`<p style="margin:0;color:var(--muted);font-size:14px">Sin notas todavía.</p>`}</div>
    ${canNote(t)?`<form class="f" id="noteForm"><textarea id="noteText" placeholder="Escribe un avance o información de la tarea…" maxlength="600" required></textarea>
      ${iAmAssignedLow?`<label class="inline-check"><input type="checkbox" id="noteNeedsTime"> Necesito más plazo para esta tarea</label>`:""}
      <button class="btn small primary" type="submit">Agregar nota</button></form>`:""}
  </div>
  <div class="btn-row">
    ${canCreate()?`<button class="btn" data-split="${esc(t.id)}">Dividir tarea</button>`:""}
    ${canEdit(t)?`<button class="btn" data-edit="${esc(t.id)}">Editar</button><button class="btn danger" data-del="${esc(t.id)}">Eliminar</button>`:""}
  </div>`}

function taskForm(o){
  const t=o.id?S.tasks.find(x=>x.id===o.id):null;const parent=o.padre?S.tasks.find(x=>x.id===o.padre):null;
  const v=t||{titulo:parent?parent.titulo+" – parte":"",descripcion:"",categoria:parent?parent.categoria:CATS[0],prioridad:parent?parent.prioridad:"media",fechaLimite:parent?parent.fechaLimite:"",asignados:[]};
  const ids=Object.keys(S.members).filter(id=>canAssignTo(id)||(v.asignados||[]).includes(id)).sort((a,b)=>nameOf(a).localeCompare(nameOf(b)));
